<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue and Gold Template</title>
    <style>
        :root {
            --navy-blue: #0b132b;
            --royal-blue: #1c2541;
            --gold: #d4af37;
            --light-gold: #f3e5ab;
            --text-color: #ffffff;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--navy-blue);
            color: var(--text-color);
        }
        header {
            background-color: var(--royal-blue);
            border-bottom: 2px solid var(--gold);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            color: var(--gold);
            margin: 0;
            font-size: 24px;
        }
        nav a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }
        nav a:hover {
            color: var(--gold);
        }
        .hero {
            padding: 80px 20px;
            text-align: center;
            background: linear-gradient(135deg, var(--navy-blue), var(--royal-blue));
        }
        .hero h2 {
            color: var(--gold);
            font-size: 40px;
            margin-bottom: 20px;
        }
        .hero p {
            color: var(--light-gold);
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto 30px auto;
        }
        .btn {
            background-color: var(--gold);
            color: var(--navy-blue);
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
        }
        .btn:hover {
            background-color: var(--light-gold);
        }
    </style>
</head>
<body>
    <header>
        <h1>BrandName</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <section class="hero">
        <h2>Luxury & Elegance</h2>
        <p>A professional, high-end blue and gold layout suited for modern corporate websites, portfolios, or luxury services.</p>
        <a href="#" class="btn">Get Started</a>
    </section>
</body>
</html>

    <script src="https://jsdelivr.net"></script>
</body>
</html>
